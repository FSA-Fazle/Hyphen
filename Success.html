<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent | Hyphen Magazine</title>
    <meta name="robots" content="noindex">
<style>
    @font-face {
        font-family: "Minion Pro";
        src: url("font/MinionPro-Regular.otf") format("opentype");
        font-display: swap;
    }

    :root {
        --brand: #d12229;
        --brand-dark: #a8181e;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --bg: #d3ecdf;
        --surface: #ffffff;
        --line: #e6e2dc;
        --radius: 14px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.06);
        --serif: "Minion Pro", Georgia, "Times New Roman", serif;
        --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: var(--sans);
        color: var(--ink);
        background: var(--bg);
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }

    /* Navigation */
    .site-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: saturate(180%) blur(12px);
        -webkit-backdrop-filter: saturate(180%) blur(12px);
        border-bottom: 1px solid var(--line);
    }

    .nav-inner {
        max-width: 1160px;
        margin: 0 auto;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }

    .logo {
        font-family: var(--serif);
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--ink);
        text-decoration: none;
        letter-spacing: -0.01em;
    }

    .logo span {
        color: var(--brand);
    }

    .nav-links {
        display: flex;
        gap: 4px;
        list-style: none;
        margin: 0;
        padding: 0;
        flex-wrap: wrap;
    }

    .nav-links a {
        display: block;
        padding: 8px 14px;
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
        font-size: 0.95rem;
        font-weight: 500;
        transition: background-color 0.2s, color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
        background: var(--bg);
        color: var(--brand);
    }

    /* Hero */
    .hero {
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
        color: #fff;
        text-align: center;
        padding: 72px 24px 80px;
    }

    .hero h1 {
        font-family: var(--serif);
        font-size: clamp(2.2rem, 5vw, 3.6rem);
        line-height: 1.1;
        margin: 0;
        letter-spacing: -0.02em;
    }

    /* Content */
    main {
        flex: 1;
        width: 100%;
        max-width: 640px;
        margin: 0 auto;
        padding: 56px 24px 72px;
    }

    .panel {
        background: var(--surface);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 44px;
        text-align: center;
    }

    .check {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #2e8b57;
        color: #fff;
        display: grid;
        place-items: center;
    }

    .panel h2 {
        font-family: var(--serif);
        font-size: 1.9rem;
        margin: 0 0 8px;
    }

    .panel p {
        margin: 0 0 28px;
        color: var(--muted);
    }

    .actions {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
    }

    .btn {
        display: inline-flex;
        align-items: center;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        border: 1.5px solid var(--brand);
        color: var(--brand);
        background: transparent;
        transition: background-color 0.2s, color 0.2s;
    }

    .btn:hover,
    .btn:focus-visible {
        background: var(--brand);
        color: #fff;
    }

    .btn.primary {
        background: var(--brand);
        color: #fff;
    }

    .btn.primary:hover,
    .btn.primary:focus-visible {
        background: var(--brand-dark);
        border-color: var(--brand-dark);
    }

    /* Footer */
    footer {
        background: var(--ink);
        color: #bdbdbd;
        text-align: center;
        padding: 28px 24px;
        font-size: 0.9rem;
    }

    footer p {
        margin: 0;
    }

    @media (max-width: 600px) {
        .nav-inner {
            justify-content: center;
        }
        .hero {
            padding: 52px 20px 56px;
        }
        main {
            padding: 40px 16px 56px;
        }
        .panel {
            padding: 32px 22px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        * {
            transition: none !important;
        }
    }
</style>
</head>
<body>
    <nav class="site-nav">
        <div class="nav-inner">
            <a class="logo" href="index.html">Hyphen<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="Contact.html">Contact</a></li>
                <li><a href="https://blog.hyphenmagazine.ca/" target="_blank" rel="noopener">Blog</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <h1>Contact Hyphen Magazine</h1>
    </header>

    <main>
        <section class="panel">
            <div class="check" aria-hidden="true">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </div>
            <h2>Thank you!</h2>
            <p>Your message has been sent. We will get back to you very soon.</p>
            <div class="actions">
                <a class="btn primary" href="index.html">Back to home</a>
                <a class="btn" href="Contact.html">Send another message</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Hyphen Magazine</p>
    </footer>
</body>
</html>
